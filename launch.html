<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>SAHAN</title>
    <style>
        html, body{background: #000; width: 100%;
        }
        *{margin: 0; padding: 0; box-sizing: border-box;}
        .wrap_container{position: relative; margin: 0 auto; width: 100%; max-width:991px; min-height: 100vh; background: url('./img/launch_bg.png') no-repeat center top/100% auto; padding: 240px 0; display: flex; flex-direction: column; justify-content: space-between;}
        p{line-height: 1.5;}

        .logo{text-align: center; margin: 0 auto;}
        .desc{margin-top: 120px; font-size:28px; color:#fff; text-align: center;}

        .notice{margin-top: 240px; font-size:26px; color:#999; text-align: center;}
        .notice span{margin-top: 10px; font-size:22px}
        .app_wrap{margin-top: 60px; display: flex; justify-content: center; align-items: center; gap:40px}
        .app_wrap li.continue{opacity:.4}
        .link{display: block; margin: 80px auto 0; text-align: center; text-decoration: underline; color:#999; font-size:22px}

        @media (max-width:991px) {
            .wrap_container{padding: 24.218vw 0; }
            .logo img{width: 38.143vw;}
            .desc{margin-top: 12.109vw; font-size:2.825vw; color:#fff; text-align: center;}

            .notice{font-size:2.624vw;}
            .notice span{margin-top: 1.009vw; font-size:2.22vw}
            .app_wrap{margin-top: 6.054vw;gap:4.036vw}
            .app_wrap li img{width: 12.109vw;}
            .link{margin: 8.073vw auto 0; font-size:2.22vw}
        }
    </style>
    </head>
    <body>
        <div class="wrap_container">
            <div class="top_sec">
                <div class="logo">
                    <img src="./img/logo.png" alt="">
                </div>
            </div>
            <div class="bot_sec">
                <p class="notice">
                    안드로이드의 경우 현재 심사 테스트 진행 중인 관계로<br>apk 파일 다운로드를 통한 설치만 가능합니다.
                    <br>
                    <span>(파일 열기 &gt; 설치 &gt; 무시하고 설치 &gt; 세부정보 더보기 &gt; 무시하고 설치하기)</span>
                </p>
                <ul class="app_wrap">                    
                    <li>
                        <a href="https://apps.apple.com/app/sahan/id6821580121" target="_blank"><img src="./img/ico_appstore.png" alt="앱스토어로 이동"></a>
                    </li>
                    <li class="continue">
                        <a href="https://play.google.com/store/apps/details?id=kr.co.dothome.sahan" target="_blank"><img src="./img/ico_playstore.png" alt="플레이스토어로 이동"></a>
                    </li>
                    <li>
                        <a href="https://github.com/genie127/26SA08HA28N/releases/download/sahan/sahan.apk"><img src="./img/ico_apk.png" alt="apk 파일 다운"></a>
                    </li>
                </ul>

                <a href="https://docs.google.com/spreadsheets/d/1cBSpczog56aoJrTY2lAsbIcJV3YdtQGE-nmD2TKsC1w/edit?gid=0#gid=0" class="link" target="_blank">오류 및 개선 문의</a>
            </div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function(){
                document.querySelectorAll('.continue a').forEach(function (a) {
                    a.setAttribute('href', "javascript:alert('앱 심사 진행중입니다.')");
                    a.setAttribute('target', "");
                });
            })
        </script>
    </body>
</html>
