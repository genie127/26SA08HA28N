<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지 전환</title>
</head>
<body>

<script>
  // 실제 화면 전환 시점
  const CHANGE_DATE = '20261021000000';

  // URL 파라미터로 테스트 시점 지정
  const params = new URLSearchParams(location.search);
  const testDate = params.get('test');

  // 테스트 파라미터가 있으면 해당 시점을 기준으로 사용
  const today = testDate
    ? testDate
    : getCurrentDate();

  // 기준 시점 이전이면 index.html, 이후면 test.html
  const target = today < CHANGE_DATE
    ? 'continue.html'
    : 'launch.html';

  // 현재 페이지와 다를 때만 이동
  const currentPage = location.pathname.split('/').pop();

  if (currentPage !== target) {
    location.replace(target);
  }

  // 현재 날짜를 YYYYMMDDHHmmss 형식으로 반환
  function getCurrentDate() {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');

    return (
      now.getFullYear() +
      pad(now.getMonth() + 1) +
      pad(now.getDate()) +
      pad(now.getHours()) +
      pad(now.getMinutes()) +
      pad(now.getSeconds())
    );
  }
</script>

</body>
</html>
